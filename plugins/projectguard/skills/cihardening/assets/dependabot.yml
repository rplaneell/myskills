# Dependabot opens update pull requests for outdated or vulnerable dependencies. It never merges anything:
# you review each pull request and the checks must be green first. Keep only the ecosystems your project uses.
version: 2
updates:
  - package-ecosystem: "npm"            # package.json
    directory: "/"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 3
    commit-message: { prefix: "chore(deps)" }
  - package-ecosystem: "pip"            # requirements.txt
    directory: "/"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 3
    commit-message: { prefix: "chore(deps)" }
  - package-ecosystem: "github-actions" # the pinned actions in .github/workflows (SHA plus version comment)
    directory: "/"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 3
    commit-message: { prefix: "chore(ci)" }
# Dependabot ALERTS (warnings about known vulnerable versions) are a separate switch: Settings, Code security, Dependabot alerts.
