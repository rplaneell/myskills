name: secret-scan
# Fails the push if a key, token or password appears anywhere in Git history.
# After copying: run pin_actions.py --write --newest so the checkout action is pinned to a full commit SHA.
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # the whole history, not just the last commit
      - name: Install gitleaks (the download is checked against a known SHA 256 fingerprint)
        env:
          GITLEAKS_VERSION: "8.30.1"
          # Copy from the official gitleaks_<version>_checksums.txt of that release (scripts/gitleaks_checksum.sh prints it).
          # Change the version and this fingerprint TOGETHER.
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks
          ./gitleaks version
      - name: Scan the whole history
        run: ./gitleaks git --no-banner --redact -v .
